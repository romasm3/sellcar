# ═══════════════════════════════════════════════════════════════════
# TIKRAS LANKYTOJO IP — įdėti į autoleft.com server bloko `location /`
#
# Django sėdi už nginx (per /run/gunicorn.sock), tad REMOTE_ADDR jam yra
# pats nginx — 127.0.0.1. Be žemiau esančių antraščių VISI lankytojai
# atrodytų kaip vienas ir tas pats adresas: /admin-moderate/visitors/
# rodytų vieną unikalų lankytoją, o šalis — „Nežinoma" (GeoIP iš
# 127.0.0.1 nieko nepasako).
#
# Skaito: apps/analytics/middleware.py -> tikras_ip()
#   1) X-Forwarded-For — pirmas adresas grandinėje yra klientas
#   2) X-Real-IP — atsarginis
#   3) REMOTE_ADDR — jei nė vienos antraštės nėra
#
# X-Forwarded-Proto jau būtinas dėl SECURE_SSL_REDIRECT (žr.
# deploy-agent.sh statinių patikrą) — greičiausiai jis jau yra.
# ═══════════════════════════════════════════════════════════════════

location / {
    proxy_pass http://unix:/run/gunicorn.sock;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ── Patikra pritaikius ─────────────────────────────────────────────
#   sudo nginx -t && sudo systemctl reload nginx
#
# Paskui atidaryti /admin-moderate/visitors/ ir pažiūrėti lentelę:
#   · matosi tikros šalys (Lietuva, Vokietija…)  → antraštės veikia
#   · viskas suplaukė į „Nežinoma", unikalių 1   → antraščių nėra
#
# Šalių pavadinimams dar reikia `geoip2` paketo ir
# data/GeoLite2-Country.mmdb (kelias — settings.GEOIP_PATH). Jų nesant
# lankytojai skaičiuojami, o šalis lieka „Nežinoma" — nieko nelūžta.
