# ═══════════════════════════════════════════════════════════════════
# STATINIŲ FAILŲ TALPYKLA — įdėti į autoleft.com server bloką
#
# Kaip buvo (patikrinta 2026-09-01 gyvoje svetainėje):
#
#     GET /static/css/style.css
#         Last-Modified: ...        ETag: ...
#         Cache-Control: (NĖRA)
#
# Be Cache-Control naršyklė kešuoja EURISTIŠKAI: pati nusprendžia, kiek
# laikyti (dažniausiai 10 % laiko nuo Last-Modified), ir failo
# neperklausia. Todėl po dizaino keitimo lankytojas matydavo seną CSS su
# nauju HTML — sulaužytą puslapį — kol nepaspausdavo Ctrl+Shift+R.
#
# HTML jau buvo teisingas („no-cache, must-revalidate", jį deda
# apps/listings/kesavimas.py), tad keisti reikia tik statinius.
#
# Nuo šiol vardai turi turinio maišą (style.df8265b02e1b.css), todėl
# ilgas galiojimas saugus: pakeitus failą pasikeičia vardas, o senojo
# niekas nebeprašo. `immutable` dar ir uždraudžia naršyklei perklausti
# per F5.
# ═══════════════════════════════════════════════════════════════════

# 1. SUMAIŠYTI failai — metai ir „immutable".
#    Maišas: taškas, 8–12 šešioliktainių, taškas, plėtinys.
location ~* ^/static/.+\.[0-9a-f]{8,12}\.(css|js|svg|png|jpg|jpeg|webp|woff2?|ico)$ {
    alias /root/autoleft/staticfiles/;
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# 2. NESUMAIŠYTI statiniai — laiškų logotipai, robots.txt ir senos
#    nuorodos. Trumpai ir su privaloma patikra, kad nepakartotų senos
#    bėdos.
location /static/ {
    alias /root/autoleft/staticfiles/;
    access_log off;
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
}

# 3. Įkeltos nuotraukos — turinys nesikeičia, vardas unikalus.
location /media/ {
    alias /root/autoleft/media/;
    access_log off;
    add_header Cache-Control "public, max-age=2592000" always;
}

# 4. HTML — Cache-Control ateina iš Django (kesavimas.py). Svarbu
#    nginx'e jo NEPERRAŠYTI: jokio `expires` ar `add_header Cache-Control`
#    pagrindiniame location / bloke.
#
# ── Patikra pritaikius ─────────────────────────────────────────────
#   curl -sI https://autoleft.com/static/css/style.<maišas>.css | grep -i cache
#       → Cache-Control: public, max-age=31536000, immutable
#   curl -sI https://autoleft.com/ | grep -i cache
#       → Cache-Control: no-cache, must-revalidate
#
#   sudo nginx -t && sudo systemctl reload nginx
