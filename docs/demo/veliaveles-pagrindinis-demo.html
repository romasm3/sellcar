<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoLeft — vėliavėlės pagrindiniame</title>
<style>
:root{--ink:#181B1F;--text:#1A1A1A;--muted:#6B7280;--border:#E5E7EB;--strong:#D1D5DB;
 --soft:#F4F4F5;--acc:#E14D28;--gr:#16A34A;--pill:999px}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;
 color:var(--text);font-size:14px;line-height:1.45;background:#fff;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}

.hdr{border-bottom:1px solid var(--border);height:72px;display:flex;align-items:center;
 justify-content:space-between;padding:0 28px}
.logo{font-size:24px;font-weight:800;letter-spacing:-.5px}
.logo span{color:var(--acc)}
.hdr-r{display:flex;align-items:center;gap:18px;color:var(--muted)}
.ikelti{height:44px;padding:0 20px;border-radius:var(--pill);border:1px solid var(--strong);
 background:#fff;font-weight:600;color:var(--text)}

.wrap{max-width:1500px;margin:0 auto;padding:22px 28px 60px}
.hint{background:#F7F8F9;border:1px dashed var(--strong);border-radius:12px;padding:13px 16px;
 color:var(--muted);margin-bottom:18px}
.hint b{color:var(--text)}

/* šalies eilutė */
.srow{border:1px solid var(--border);border-radius:12px;height:56px;display:flex;align-items:center;
 gap:12px;padding:0 18px;margin-bottom:22px;position:relative}
.srow .cur{font-weight:600;font-size:15px}
.srow .sub{color:var(--muted)}
.srow .keisti{margin-left:auto;height:38px;padding:0 16px;border-radius:var(--pill);
 border:1px solid var(--strong);background:#fff;font-weight:600;display:flex;align-items:center;gap:8px}
.srow .keisti svg{width:13px;height:13px;stroke:var(--ink);fill:none;stroke-width:2;transition:transform .15s}
body.pick .srow .keisti svg{transform:rotate(180deg)}
.dd{position:absolute;top:62px;right:0;width:380px;background:#fff;border-radius:14px;
 box-shadow:0 14px 40px rgba(0,0,0,.18);display:none;z-index:20;padding:8px 0;max-height:420px;overflow:auto}
body.pick .dd{display:block}
.ditem{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;text-align:left;
 padding:0 16px;height:46px}
.ditem:hover,.ditem.on{background:var(--soft)}
.ditem .t{flex:1;font-weight:500}
.ditem.on .t{font-weight:700}
.ditem .c{color:var(--muted);font-size:13px}
.scrim{position:fixed;inset:0;z-index:10;display:none}
body.pick .scrim{display:block}

/* skirtukai */
.tabs{display:flex;gap:32px;border-bottom:1px solid var(--border);margin-bottom:22px}
.tabs button{border:0;background:none;padding:0 0 14px;font-size:16px;color:var(--muted);
 border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--gr);font-weight:600;border-bottom-color:var(--gr)}

/* tinklelis */
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:20px}
@media(max-width:1280px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff}
.card .ph{position:relative;aspect-ratio:4/3;background:#DDE1E4}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.zb{position:absolute;left:8px;bottom:8px;background:rgba(24,27,31,.78);color:#fff;font-size:11px;
 font-weight:600;padding:3px 7px;border-radius:5px}
.card .b{padding:11px 12px 13px}
.card .n{font-weight:600;font-size:14px;line-height:1.3;
 display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card .s{color:var(--muted);font-size:12.5px;margin-top:3px;
 display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card .p{font-weight:700;font-size:16px;margin-top:7px}
.card .l{margin-top:6px;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px}
.card .l .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .l .fr{margin-left:auto;display:flex;flex:0 0 auto}
.card .l .pin{width:11px;height:11px;stroke:var(--muted);fill:none;stroke-width:2;flex:0 0 auto}
.fl{width:16px;height:12px;border-radius:2px;flex:0 0 auto;box-shadow:0 0 0 1px rgba(0,0,0,.10) inset;display:block}
.fl-b{width:20px;height:15px}
.tog{display:flex;align-items:center;gap:8px;margin-bottom:16px;color:var(--muted)}
.tog button{height:34px;padding:0 14px;border-radius:var(--pill);border:1px solid var(--border);
 background:#fff;font-weight:500;font-size:13px}
.tog button:hover{background:var(--soft)}
.tog button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
h3{font-size:15px;color:var(--muted);font-weight:600;margin:26px 0 12px}
</style>
</head>
<body>
<div class="scrim" id="scrim"></div>

<header class="hdr">
  <div class="logo">Auto<span>Left</span></div>
  <div class="hdr-r"><span id="hdrfl"></span><span>LT</span><button class="ikelti">+ Įkelti</button><span>♡ 2</span><span>✉</span></div>
</header>

<div class="wrap">
  <div class="hint"><b>Pagrindinis puslapis.</b> Vėliavėlė ir vieta — po kaina, viena eilutė.
  Perjunk į „Visos šalys" ir pamatysi, kodėl jos reikia.</div>

  <div class="tog">
    <span>Vėliava:</span>
    <button data-pos="po" class="on">Iškart po šalies — PASIRINKTA</button>
    <button data-pos="desine">Dešinėje, eilutės gale</button>
    <button data-pos="pries">Prieš tekstą</button>
    <button data-pos="tik">Gale, be šalies pavadinimo</button>
  </div>

  <div class="srow">
    <span id="curfl"></span>
    <span class="cur" id="curnm">Lietuva</span>
    <span class="sub" id="cursub">· 4 821 skelbimas</span>
    <button class="keisti" id="keisti">Keisti šalį <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="dd" id="dd"></div>
  </div>

  <div class="tabs">
    <button class="on">Pasiūlymai</button><button>Dienos pasiūlymai</button>
    <button>Naujausias</button><button>Populiariausi</button><button>Brangiausias</button>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
const H=(a,b,c)=>`<rect width="30" height="7.33" fill="${a}"/><rect width="30" height="7.33" y="7.33" fill="${b}"/><rect width="30" height="7.34" y="14.66" fill="${c}"/>`;
const V=(a,b,c)=>`<rect width="10" height="22" fill="${a}"/><rect width="10" height="22" x="10" fill="${b}"/><rect width="10" height="22" x="20" fill="${c}"/>`;
const CROSS=(bg,c1,c2)=>`<rect width="30" height="22" fill="${bg}"/>`+
 (c2?`<rect x="9" width="5" height="22" fill="${c2}"/><rect y="8.5" width="30" height="5" fill="${c2}"/>`:``)+
 `<rect x="10" width="3" height="22" fill="${c1}"/><rect y="9.5" width="30" height="3" fill="${c1}"/>`;
const FLAGS={
 lt:H("#FDB913","#006A44","#C1272D"), de:H("#000","#DD0000","#FFCE00"),
 pl:`<rect width="30" height="11" fill="#fff"/><rect y="11" width="30" height="11" fill="#DC143C"/>`,
 lv:`<rect width="30" height="22" fill="#9E3039"/><rect y="9" width="30" height="4" fill="#fff"/>`,
 ee:H("#4891D9","#000","#FFF"), nl:H("#AE1C28","#FFF","#21468B"),
 fr:V("#002395","#FFF","#ED2939"), it:V("#009246","#FFF","#CE2B37"),
 be:V("#000","#FDDA24","#EF3340"), at:H("#ED2939","#FFF","#ED2939"),
 es:`<rect width="30" height="22" fill="#AA151B"/><rect y="5.5" width="30" height="11" fill="#F1BF00"/>`,
 cz:`<rect width="30" height="11" fill="#fff"/><rect y="11" width="30" height="11" fill="#D7141A"/><polygon points="0,0 13,11 0,22" fill="#11457E"/>`,
 ua:`<rect width="30" height="11" fill="#0057B7"/><rect y="11" width="30" height="11" fill="#FFD700"/>`,
 se:CROSS("#006AA7","#FECC00"), dk:CROSS("#C8102E","#FFF"),
 fi:CROSS("#FFF","#003580"), no:CROSS("#BA0C2F","#00205B","#FFF"),
 ch:`<rect width="30" height="22" fill="#D52B1E"/><rect x="12.5" y="5" width="5" height="12" fill="#fff"/><rect x="9" y="8.5" width="12" height="5" fill="#fff"/>`,
 gb:`<rect width="30" height="22" fill="#012169"/><path d="M0,0 30,22 M30,0 0,22" stroke="#fff" stroke-width="4"/><rect x="12" width="6" height="22" fill="#fff"/><rect y="8" width="30" height="6" fill="#fff"/><rect x="13.5" width="3" height="22" fill="#C8102E"/><rect y="9.5" width="30" height="3" fill="#C8102E"/>`,
 visos:`<rect width="30" height="22" fill="#EEF1F3"/><circle cx="15" cy="11" r="7.5" fill="none" stroke="#6B7280" stroke-width="1.4"/><path d="M15 3.5v15M7.5 11h15M15 3.5c3 3.5 3 11.5 0 15M15 3.5c-3 3.5-3 11.5 0 15" fill="none" stroke="#6B7280" stroke-width="1.1"/>`};
const flag=(k,big)=>`<svg class="fl${big?' fl-b':''}" viewBox="0 0 30 22" preserveAspectRatio="none" role="img" aria-label="${(D[k]||{nm:''}).nm}">${FLAGS[k]||FLAGS.visos}</svg>`;

const D={visos:{nm:"Visos šalys",n:48320},lt:{nm:"Lietuva",n:4821},de:{nm:"Vokietija",n:21750},
 pl:{nm:"Lenkija",n:8340},fr:{nm:"Prancūzija",n:6890},it:{nm:"Italija",n:5460},
 gb:{nm:"Jungtinė Karalystė",n:5310},nl:{nm:"Nyderlandai",n:4110},be:{nm:"Belgija",n:3020},
 se:{nm:"Švedija",n:2480},cz:{nm:"Čekija",n:2210},at:{nm:"Austrija",n:1990},
 ua:{nm:"Ukraina",n:1870},dk:{nm:"Danija",n:1740},lv:{nm:"Latvija",n:1204},ee:{nm:"Estija",n:980}};

const IMG=["photo-1552519507-da3b142c6e3d","photo-1503376780353-7e6692767b70","photo-1555215695-3004980ad54e",
 "photo-1541899481282-d53bffe3c35d","photo-1520031441872-265e4ff70366","photo-1494976388531-d1058494cdd8",
 "photo-1606664515524-ed2f786a0bd6","photo-1519641471654-76ce0107ad1b","photo-1449965408869-eaa3f722e40d",
 "photo-1583121274602-3e2820c69888","photo-1533473359331-0135ef1b58bf","photo-1502877338535-766e1452684a"];
const SK=[
 ["AMC Matador 2012","Benzinas / dujos · Sedanas","5 000 €","Kaunas","lt"],
 ["Škoda Octavia","1.6 TDI · Universalas","12 700 €","Šiauliai","lt"],
 ["BMW 320d Touring","2.0 D · Universalas","15 900 €","Vilnius","lt"],
 ["Volkswagen Golf","1.5 TSI · Hečbekas","16 900 €","München","de"],
 ["Mercedes-Benz G63 AMG","4.0 · Visureigis","115 000 €","Berlin","de"],
 ["Peugeot 3008","1.2 · Visureigis","13 900 €","Lyon","fr"],
 ["Volvo XC60","2.0 D · Visureigis","19 400 €","Göteborg","se"],
 ["Land Rover Defender","3.0 D · Visureigis","62 500 €","Manchester","gb"],
 ["Opel Astra","1.6 CDTI · Hečbekas","8 900 €","Warszawa","pl"],
 ["Fiat 500","1.2 · Hečbekas","6 400 €","Milano","it"],
 ["Toyota RAV4","2.5 Hybrid · Visureigis","18 400 €","Klaipėda","lt"],
 ["Audi A4","2.0 TDI · Sedanas","10 800 €","Praha","cz"]];

const PIN='<svg class="pin" viewBox="0 0 24 24"><path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>';
let pos='po';
function vieta(s){
  const f=flag(s[4]), m=s[3], n=D[s[4]].nm;
  if(pos==='desine') return `${PIN} <span class="txt">${m}, ${n}</span><span class="fr">${f}</span>`;
  if(pos==='po')  return `${PIN} ${m}, ${n} ${f}`;
  if(pos==='tik') return `${PIN} ${m} ${f}`;
  return `${PIN} ${f} ${m}, ${n}`;
}
const el=id=>document.getElementById(id), b=document.body;
const nr=n=>n.toLocaleString('lt-LT').replace(/ /g,' ');
let dabar='lt';

function pieskSali(k){
  dabar=k;
  el('curfl').innerHTML=flag(k,true);
  el('curnm').textContent=D[k].nm;
  el('cursub').textContent='· '+nr(D[k].n)+' skelbimų';
  el('dd').innerHTML=Object.entries(D).map(([kk,v])=>`
    <button class="ditem${kk===dabar?' on':''}" data-s="${kk}">
      ${flag(kk)}<span class="t">${v.nm}</span><span class="c">${nr(v.n)}</span></button>`).join('');
  const sk = k==='visos' ? SK : SK.filter(s=>s[4]===k);
  const rod = sk.length?sk:SK;
  el('grid').innerHTML=rod.map((s,i)=>`
    <article class="card">
      <div class="ph"><img src="https://images.unsplash.com/${IMG[i%IMG.length]}?w=500&q=65" alt="" loading="lazy">
        <span class="zb">Žiūrėjote</span></div>
      <div class="b">
        <div class="n">${s[0]}</div>
        <div class="s">${s[1]}</div>
        <div class="p">${s[2]}</div>
        <div class="l">${vieta(s)}</div>
      </div>
    </article>`).join('');
}
el('hdrfl').innerHTML=flag('lt',true);
el('keisti').onclick=e=>{e.stopPropagation();b.classList.toggle('pick')};
el('scrim').onclick=()=>b.classList.remove('pick');
el('dd').addEventListener('click',e=>{const s=e.target.closest('[data-s]');if(!s)return;
 pieskSali(s.dataset.s);b.classList.remove('pick')});
document.querySelector('.tog').addEventListener('click',e=>{
  const t=e.target.closest('[data-pos]'); if(!t)return;
  document.querySelectorAll('.tog button').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); pos=t.dataset.pos; pieskSali(dabar);
});
pieskSali('lt');
</script>
</body>
</html>
