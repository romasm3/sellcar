{% comment %}
Įmonių stiliai — vienoje vietoje sąrašui ir įmonės puslapiui.
Matmenys ir spalvos iš docs/imones-demo.html, bet kintamieji mūsų
dizaino sistemos (docs/dizaino-sistema.md): akcentas — antracitas.
{% endcomment %}
<style>
  /* ═══ Skirtukai „Skelbimai | Įmonės" ═══ */
  .im-tabs { display: flex; gap: 4px; width: max-content; padding: 4px;
             background: var(--surface-muted, #F9FAFB); border-radius: 999px;
             border: 1px solid var(--border); }
  .im-tab { padding: 7px 20px; border: 0; border-radius: 999px; background: none;
            font-size: 15px; font-weight: var(--fw-semibold); color: var(--text-muted);
            text-decoration: none; cursor: pointer; transition: all var(--dur); }
  .im-tab.is-on { background: var(--surface); color: var(--text);
                  box-shadow: 0 1px 3px rgba(0,0,0,.10); }

  /* ═══ Sąrašas ═══ */
  .im-virsus { display: flex; align-items: center; gap: var(--sp-4);
               flex-wrap: wrap; padding: var(--sp-4) 0; }
  .im-rasta { font-size: var(--fs-sm); color: var(--text-muted); }
  .im-rasta b { color: var(--text); }
  .im-filtrai { display: flex; gap: var(--sp-2); flex-wrap: wrap;
                margin-left: auto; }
  .im-sel, .im-ieskoti { height: var(--btn-h); padding: 0 var(--sp-3);
            border: 1px solid var(--border); border-radius: var(--r-md);
            background: var(--surface); color: var(--text); font-size: var(--fs-sm); }
  .im-tinklas { display: grid; gap: var(--sp-4);
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .im-kort { display: block; background: var(--surface); border: 1px solid var(--border);
             border-radius: var(--r-md); overflow: hidden; text-decoration: none;
             color: inherit; transition: border-color var(--dur), box-shadow var(--dur); }
  .im-kort:hover { border-color: var(--accent); box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  .im-foto { position: relative; aspect-ratio: 16 / 10; background: var(--accent-soft);
             display: flex; align-items: center; justify-content: center; }
  .im-foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .im-foto .im-logo { width: 96px; height: 96px; object-fit: contain; background: none; }
  .im-zyma { position: absolute; left: 8px; top: 8px; padding: 3px 8px;
             background: rgba(17,24,39,.82); color: #fff; font-size: 11px;
             font-weight: var(--fw-semibold); border-radius: 4px; }
  .im-kort-turinys { padding: var(--sp-3); }
  .im-vardas { font-size: 16px; font-weight: var(--fw-semibold); }
  .im-meta { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .im-veiklos { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .im-pill { display: inline-block; margin-top: 8px; padding: 2px 8px;
             border: 1px solid var(--border); border-radius: 999px;
             font-size: 11px; font-weight: var(--fw-semibold); color: var(--text-muted); }
  .im-pill.is-prek { color: var(--accent); background: var(--accent-soft);
                     border-color: transparent; }
  .im-tuscia { padding: var(--sp-8) var(--sp-4); text-align: center;
               color: var(--text-muted); }

  /* ═══ Įmonės puslapis ═══ */
  .im-h1 { font-size: 30px; font-weight: var(--fw-bold); letter-spacing: -.02em; }
  .im-hmeta { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
              margin-top: 8px; font-size: var(--fs-sm); color: var(--text-muted); }
  .im-atidaryta { color: var(--success, #067647); font-weight: var(--fw-semibold); }
  .im-uzdaryta { color: var(--text-disabled, #9CA3AF); font-weight: var(--fw-semibold); }
  .im-nuoroda { color: var(--accent); font-weight: var(--fw-semibold); text-decoration: none; }
  .im-nuoroda:hover { text-decoration: underline; }

  .im-galerija { display: grid; grid-template-columns: 2fr 1fr 1fr;
                 grid-template-rows: 1fr 1fr; gap: 8px; margin-top: var(--sp-5);
                 height: 340px; }
  .im-galerija > * { background: var(--accent-soft); border-radius: 6px;
                     overflow: hidden; position: relative; }
  .im-galerija > *:first-child { grid-row: 1 / 3; border-radius: var(--r-md) 0 0 var(--r-md); }
  .im-galerija > *:nth-child(3) { border-radius: 0 var(--r-md) 0 0; }
  .im-galerija > *:nth-child(5) { border-radius: 0 0 var(--r-md) 0; }
  .im-galerija img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .im-visos { position: absolute; right: 12px; bottom: 12px; padding: 8px 14px;
              background: var(--surface); border-radius: var(--r-md);
              font-size: var(--fs-sm); font-weight: var(--fw-semibold);
              box-shadow: 0 2px 8px rgba(0,0,0,.18); }

  .im-stulpeliai { display: grid; grid-template-columns: minmax(0,1fr) 340px;
                   gap: var(--sp-8); align-items: start;
                   margin: var(--sp-8) 0 var(--sp-10); }
  .im-blokas { background: var(--surface); border: 1px solid var(--border);
               border-radius: var(--r-md); padding: var(--sp-5); margin-bottom: var(--sp-4); }
  .im-blokas h2 { font-size: 18px; font-weight: var(--fw-bold); margin-bottom: 14px; }
  .im-blokas h2 span { font-weight: 400; color: var(--text-muted); font-size: 15px; }

  .im-paslauga { display: flex; justify-content: space-between; gap: var(--sp-4);
                 align-items: center; padding: 14px 0; border-top: 1px solid var(--border); }
  .im-paslauga:first-of-type { border-top: 0; padding-top: 0; }
  .im-paslauga .p-vardas { font-size: 15px; font-weight: var(--fw-semibold); }
  .im-paslauga .p-apie { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .im-paslauga .p-kaina { font-size: 16px; font-weight: var(--fw-bold); white-space: nowrap; }

  .im-diena { display: flex; justify-content: space-between; padding: 7px 0;
              font-size: var(--fs-sm); }
  .im-diena + .im-diena { border-top: 1px solid var(--border); }
  .im-diena .d { color: var(--text-muted); }
  .im-diena.is-siandien { font-weight: var(--fw-bold); }
  .im-diena.is-siandien .d { color: var(--text); }
  .im-diena .nedirba { color: var(--text-disabled, #9CA3AF); }

  .im-sonas { position: sticky; top: 16px; }
  .im-sonas .im-etikete { font-size: var(--fs-sm); color: var(--text-muted); }
  .im-tel { display: block; font-size: 22px; font-weight: var(--fw-bold);
            margin: 2px 0 14px; color: var(--text); text-decoration: none; }
  .im-btn { display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; height: var(--btn-h); margin-bottom: 8px; padding: 0 var(--sp-4);
            border: 1px solid var(--border); border-radius: var(--r-md);
            background: var(--surface); color: var(--text); font-size: 15px;
            font-weight: var(--fw-semibold); text-decoration: none; cursor: pointer; }
  .im-btn-pirmas { background: var(--accent); border-color: var(--accent);
                   color: var(--accent-contrast); }
  .im-zemelapis { height: 150px; margin: 14px 0 10px; border-radius: 6px;
                  border: 1px solid var(--border); overflow: hidden; }
  /* Kortelė ta pati kaip rezultatuose — horizontali, su 240 px nuotrauka.
     Todėl čia ji rodoma vienu stulpeliu: dviejuose tekstui liktų vos
     170 px ir pavadinimas suliptų su kaina. */
  .im-skelbimai { display: grid; gap: var(--sp-3); grid-template-columns: 1fr; }

  @media (max-width: 900px) {
    .im-stulpeliai { grid-template-columns: 1fr; gap: var(--sp-5); }
    .im-galerija { grid-template-columns: 1fr; grid-template-rows: 200px; height: auto; }
    .im-galerija > *:not(:first-child) { display: none; }
    .im-galerija > *:first-child { border-radius: var(--r-md); }
    .im-h1 { font-size: 22px; }
    .im-sonas { position: static; }
    .im-filtrai { margin-left: 0; width: 100%; }
    .im-sel { flex: 1 1 45%; min-width: 0; }
  }
</style>
