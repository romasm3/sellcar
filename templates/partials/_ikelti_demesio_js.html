{% comment %}„+ Įkelti" dėmesio taškelis (CSS — static/css/bazinis.css).
Nuimamas VISAM LAIKUI paspaudus arba užvedus pelę (localStorage), o šiame
puslapyje — ne vėliau kaip po 30 s. Be localStorage (privatus langas)
veikia tik 30 s riba.{% endcomment %}
<script>
(function () {
  var RAKTAS = 'ikelti_demesio_matyta';
  var mygtukai = document.querySelectorAll('.ikelti-demesio');
  if (!mygtukai.length) return;
  function nuimk() {
    for (var i = 0; i < mygtukai.length; i++) mygtukai[i].classList.remove('ikelti-demesio');
  }
  function visamLaikui() {
    try { localStorage.setItem(RAKTAS, '1'); } catch (e) {}
    document.documentElement.classList.add('ikelti-matyta');
    nuimk();
  }
  try { if (localStorage.getItem(RAKTAS)) { nuimk(); return; } } catch (e) {}
  for (var i = 0; i < mygtukai.length; i++) {
    mygtukai[i].addEventListener('mouseenter', visamLaikui, { once: true });
    mygtukai[i].addEventListener('pointerdown', visamLaikui, { once: true });
    mygtukai[i].addEventListener('click', visamLaikui, { once: true });
  }
  setTimeout(nuimk, 30000);
})();
</script>
