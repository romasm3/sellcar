<style>
  /* ═══ Pagrindinė paieška — viena juosta (Fresha pradžios puslapis) ═══ */
  .hp { max-width: 1180px; margin: 0 auto; padding: 24px 16px 8px; }
  .hp-juosta { position: relative; display: flex; align-items: center; z-index: 30;
               gap: 0; height: 72px; padding: 0 8px 0 4px;
               background: var(--surface); border: 1px solid var(--border);
               border-radius: 999px; box-shadow: 0 2px 12px rgba(17,24,39,.06); }
  .hp-juosta:focus-within { box-shadow: 0 4px 18px rgba(17,24,39,.12); }
  .hp-laukas { position: relative; display: flex; align-items: center; gap: 10px;
               flex: 1 1 0; min-width: 0; height: 100%; padding: 0 18px;
               cursor: text; }
  .hp-ko { flex: 1.3 1 0; }
  .hp-kat, .hp-kada { flex: .9 1 0; cursor: pointer; }
  .hp-kada select { cursor: pointer; }
  .hp-slepiam { display: none !important; }
  .hp-ikona { color: var(--text-muted); font-size: 15px; flex: 0 0 auto; }
  .hp-laukas input, .hp-laukas select {
      width: 100%; border: 0; padding: 0; background: transparent; outline: none;
      font-size: 16px; font-weight: var(--fw-medium); color: var(--text);
      appearance: none; text-overflow: ellipsis; font-family: inherit; }
  .hp-laukas input::placeholder { color: var(--text-muted); font-weight: 400; }
  .hp-kat select { cursor: pointer; }
  .hp-skirtis { width: 1px; height: 30px; background: var(--border); flex: 0 0 auto; }
  .hp-eiti { flex: 0 0 auto; height: 56px; padding: 0 32px; margin-left: 8px;
             border: 0; border-radius: 999px; background: var(--accent);
             color: var(--accent-contrast); font-size: 16px;
             font-weight: var(--fw-semibold); cursor: pointer;
             transition: background var(--dur); font-family: inherit; }
  .hp-eiti:hover { background: var(--accent-hover); }

  /* kortelė po pirmu lauku */
  .hp-kortele { position: absolute; top: calc(100% + 10px); left: 0; z-index: 60;
                width: min(620px, 96%); max-height: 460px; overflow-y: auto;
                padding: 16px; background: var(--surface);
                border: 1px solid var(--border); border-radius: 16px;
                box-shadow: 0 12px 32px rgba(17,24,39,.16); }
  .hp-skirtukai { display: flex; gap: 8px; margin-bottom: 14px; }
  .hp-skirtukas { padding: 8px 18px; border: 1px solid var(--border);
                  border-radius: 999px; background: var(--surface);
                  font-size: 14px; font-weight: var(--fw-semibold);
                  color: var(--text); cursor: pointer; font-family: inherit; }
  .hp-skirtukas.is-on { background: var(--accent); border-color: var(--accent);
                        color: var(--accent-contrast); }
  .hp-antraste { display: flex; align-items: center; justify-content: space-between;
                 margin: 12px 0 4px; font-size: 13px; font-weight: var(--fw-bold);
                 letter-spacing: .02em; text-transform: uppercase;
                 color: var(--text-muted); }
  .hp-kortele > .hp-antraste:first-child { margin-top: 0; }
  .hp-valyti { border: 0; background: none; color: var(--accent);
               font-size: 13.5px; font-weight: var(--fw-semibold);
               cursor: pointer; font-family: inherit; }
  .hp-eilute { display: flex; align-items: center; gap: 12px; width: 100%;
               padding: 8px 6px; border: 0; background: none; cursor: pointer;
               text-align: left; border-radius: var(--r-md); font-family: inherit;
               text-decoration: none; color: inherit; }
  .hp-eilute:hover, .hp-eilute.is-pazymeta { background: var(--accent-soft); }
  .hp-ikonele { display: flex; align-items: center; justify-content: center;
                width: 38px; height: 38px; flex: 0 0 auto; border-radius: 999px;
                overflow: hidden; background: var(--accent-soft);
                color: var(--text-muted); font-size: 13px; }
  .hp-ikonele.su-foto { border-radius: 8px; }
  .hp-ikonele img { width: 100%; height: 100%; object-fit: cover; }
  .hp-tekstas { min-width: 0; flex: 1 1 auto; }
  .hp-eilute b { display: block; font-size: 14.5px; font-weight: var(--fw-semibold);
                 color: var(--text); white-space: nowrap; overflow: hidden;
                 text-overflow: ellipsis; }
  .hp-eilute em { display: block; font-style: normal; font-size: 13px;
                  color: var(--text-muted); }
  .hp-desine { flex: 0 0 auto; font-size: 13.5px; font-weight: var(--fw-semibold);
               color: var(--text-muted); white-space: nowrap; }
  .hp-atgal { display: none; }
  .hp-tuscia { padding: 10px 6px; font-size: 13.5px; color: var(--text-muted); }

  /* vietos siūlymai */
  .hp-siulymai { position: absolute; top: calc(100% + 10px); left: 0; z-index: 60;
                 min-width: 300px; max-width: 380px; max-height: 320px;
                 overflow-y: auto; padding: 6px; background: var(--surface);
                 border: 1px solid var(--border); border-radius: 16px;
                 box-shadow: 0 12px 32px rgba(17,24,39,.16); }
  .hp-siulymas { display: flex; align-items: center; gap: 10px; width: 100%;
                 padding: 9px 10px; border: 0; background: none; cursor: pointer;
                 text-align: left; font-size: 14px; color: var(--text);
                 border-radius: var(--r-sm); font-family: inherit; }
  .hp-siulymas:hover { background: var(--accent-soft); }
  .hp-siulymas i { color: var(--text-muted); font-size: 12px; }
  .hp-osm { display: block; padding: 6px 10px; font-size: 11px;
            color: var(--text-muted); border-top: 1px solid var(--border); }
  .hp-osm a { color: inherit; text-decoration: underline; }

  /* ═══ Telefone — laukai vienas po kito ═══ */
  @media (max-width: 900px) {
    .hp { padding: 16px 16px 4px; }
    .hp-juosta { flex-direction: column; align-items: stretch; height: auto;
                 padding: 8px; border-radius: 20px; gap: 2px; }
    .hp-laukas { height: 52px; padding: 0 12px; }
    .hp-skirtis { width: auto; height: 1px; margin: 0 12px; }
    .hp-eiti { width: 100%; height: 48px; margin: 6px 0 0; }
    /* Telefone iškrentanti kortelė rišama prie visos juostos, ne prie
       siauro lauko — kitaip ji būtų vieno stulpelio pločio. */
    .hp-laukas { position: static; }
    .hp-siulymai { position: absolute; top: calc(100% + 8px); left: 0; right: 0;
                   width: auto; max-width: none;
                   box-shadow: 0 12px 32px rgba(17,24,39,.16); }
    /* Sąrašas per visą ekraną su „Atgal" — kaip prašyta telefonui */
    .hp-juosta.is-atviras { position: fixed; inset: 0; z-index: 200;
        height: 100%; border-radius: 0; padding: 8px 12px; overflow-y: auto;
        justify-content: flex-start; }
    .hp-juosta.is-atviras .hp-kortele { position: static; width: auto;
        max-width: none; max-height: none; border: 0; box-shadow: none;
        padding: 4px 0; }
    /* Atvirame ekrane laukai kompaktiškesni — vietą užleidžia sąrašui */
    .hp-juosta.is-atviras .hp-laukas { height: 46px; }
    .hp-juosta.is-atviras .hp-skirtis { margin: 0 12px; }
    .hp-juosta.is-atviras .hp-eiti { height: 44px; margin: 8px 0 2px; }
    .hp-juosta.is-atviras .hp-atgal { display: inline-flex; align-items: center;
        gap: 6px; align-self: flex-start; padding: 8px 4px; border: 0;
        background: none; color: var(--accent); font-size: 14px;
        font-weight: var(--fw-semibold); cursor: pointer; font-family: inherit; }
    body.hp-uzdengta { overflow: hidden; }
    .hp-skirtukai { flex-wrap: wrap; }
  }
</style>
