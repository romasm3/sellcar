{% comment %}Įmonės žymeklio (OverlayView) stiliai — bendri žemėlapio
paieškai ir įmonių puslapiui. Piešinys — static/js/imoniu_zymekliai.js.
{% endcomment %}
<style>
  /* Įmonės žymeklis — baltas burbulas su logotipu (OverlayView) */
  .zp-imone { position: absolute; transform: translate(-50%, -100%);
      display: inline-flex; align-items: center; gap: 6px; max-width: 200px;
      padding: 4px 10px 4px 4px; background: var(--surface);
      border: 2px solid #fff; border-radius: 999px; color: var(--text);
      font-size: 12.5px; font-weight: var(--fw-semibold); text-decoration: none;
      box-shadow: 0 2px 8px rgba(17,24,39,.28); white-space: nowrap;
      cursor: pointer; }
  .zp-imone:hover { transform: translate(-50%, calc(-100% - 3px)) scale(1.06); }
  .zp-imone img, .zp-imone-raide { width: 22px; height: 22px; flex: 0 0 auto;
      border-radius: 999px; object-fit: cover; background: var(--accent-soft);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: var(--accent); }
  .zp-imone span { overflow: hidden; text-overflow: ellipsis; }
  .zp-imone em { font-style: normal; color: var(--text-muted); }
</style>
