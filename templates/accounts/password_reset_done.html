{% extends "base.html" %}

{% block title %}Password Changed - SellCars{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card shadow">
                <div class="card-body p-5">
                    <i class="fas fa-check-circle text-success" style="font-size: 4rem;"></i>
                    <h2 class="mt-4">Password Updated!</h2>
                    <p class="text-muted mt-3">
                        Your password has been successfully changed.
                        Your account is now more secure.
                    </p>

                    <div class="mt-4">
                        <a href="{% url 'accounts:profile' %}" class="btn btn-primary btn-lg mr-2">
                            <i class="fas fa-user"></i> Back to Profile
                        </a>
                        <a href="{% url 'accounts:home' %}" class="btn btn-outline-secondary btn-lg">
                            <i class="fas fa-home"></i> Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
