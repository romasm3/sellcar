{% extends 'base.html' %}

{% block content %}
<div class="container" style="max-width: 500px; margin: 50px auto; text-align: center;">
    <h2>Logged Out</h2>

    <div style="background: #d4edda; padding: 20px; border-radius: 5px; margin: 20px 0;">
        <p>✅ You have been successfully logged out.</p>
    </div>

    <p>Thank you for using SellCar!</p>

    <div style="margin-top: 20px;">
        <a href="{% url 'accounts:login' %}" class="btn btn-primary">Login Again</a>
        <a href="{% url 'accounts:home' %}" class="btn btn-secondary">Go to Home</a>
    </div>
</div>

<style>
    .btn {
        display: inline-block;
        padding: 10px 20px;
        margin: 5px;
        text-decoration: none;
        border-radius: 5px;
        color: white;
    }
    .btn-primary {
        background: #007bff;
    }
    .btn-primary:hover {
        background: #0056b3;
    }
    .btn-secondary {
        background: #6c757d;
    }
    .btn-secondary:hover {
        background: #545b62;
    }
</style>
{% endblock %}
