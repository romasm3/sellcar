{% load static %}<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klaida serveryje — Autoleft.</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'brand/autoleft-icon.svg' %}">
  <!-- 500 puslapis renderinamas BE konteksto procesorių (jie patys gali būti
       sugedę), todėl jis savarankiškas: be base.html ir be adresų šablonų
       žymų — visos nuorodos rašomos tiesiogiai. -->
  <style>
    body { margin: 0; background: #F7F7F8; color: #181B1F;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kl { max-width: 560px; margin: 0 auto; padding: 64px 16px; text-align: center; }
    .site-logo { display: inline-flex; position: relative; }
    .site-logo img { height: 32px; width: auto; display: block; }
    /* Tas pats „beta" ženkliukas, kaip antraštėje. Šis puslapis
       savarankiškas (renderinamas BE konteksto procesorių), tad stilius
       rašomas čia, o ne imamas iš base.html. */
    /* Kabo -6px, kaip base.html: prie -12px ženkliukas nusileidžia į
       eilutę žemiau ir užlipa ant to, kas ten yra. */
    .beta-zyma { position: absolute; right: -6px; bottom: -6px;
                 font-size: 8.5px; font-weight: 700; letter-spacing: .6px;
                 text-transform: uppercase; color: #fff;
                 background: linear-gradient(90deg, #ef4444, #f97316);
                 padding: 2px 5px; border-radius: 999px; line-height: 1.2;
                 pointer-events: none; white-space: nowrap; }
    @media (max-width: 767px) { .beta-zyma { bottom: -4px; } }
    .kodas { margin-top: 32px; font-size: 64px; font-weight: 700; color: #6B7280; line-height: 1; }
    h1 { margin: 12px 0 0; font-size: 24px; }
    p { margin: 8px 0 0; color: #6B7280; }
    .btn { display: inline-flex; align-items: center; height: 40px; padding: 0 20px;
           margin-top: 24px; border-radius: 8px; background: #374151; color: #fff;
           text-decoration: none; font-weight: 600; }
    @media (max-width: 767px) { .site-logo img { height: 24px; } }
  </style>
</head>
<body>
  <div class="kl">
    <a href="/" class="site-logo" aria-label="AutoLeft">
      <img src="{% static 'brand/autoleft-logo.svg' %}" alt="AutoLeft" width="130" height="32">{% include 'partials/_beta_zyma.html' %}
    </a>
    <div class="kodas">500</div>
    <h1>Kažkas sugedo mūsų pusėje</h1>
    <p>Bandykite dar kartą po kelių minučių — jau žinom apie klaidą.</p>
    <a class="btn" href="/">Į pradžią</a>
  </div>
</body>
</html>
