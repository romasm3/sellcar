{% comment %}Sąrašų kortelės stiliai — viena vieta /skelbimai/ ir
/perziureti/ puslapiams. Matmenys ir spalvos: docs/dizaino-sistema.md.
{% endcomment %}
<style>
  .sk-sarasas { display: flex; flex-direction: column; gap: var(--sp-3); }

  .sk-kort { position: relative; display: flex; gap: var(--sp-4);
             background: var(--surface); border: 1px solid var(--border);
             border-radius: var(--r-md); overflow: hidden; }
  .sk-kort:hover { box-shadow: 0 0 8px rgba(0,0,0,.2); }
  .sk-nuotrauka { position: relative; flex: 0 0 240px; height: 180px; display: block;
                  background: var(--accent-soft); }
  .sk-nuotrauka img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sk-be-nuotraukos { display: flex; align-items: center; justify-content: center;
                      width: 100%; height: 100%; color: var(--text-muted); font-size: 28px; }
  .sk-vin { position: absolute; bottom: 8px; left: 8px; padding: 2px 6px;
            background: rgba(6,118,71,.9); color: #fff; font-size: var(--fs-xs);
            font-weight: var(--fw-semibold); border-radius: 4px; }

  .sk-turinys { flex: 1 1 auto; min-width: 0; padding: var(--sp-3) 48px var(--sp-3) 0; }
  .sk-eilute { display: flex; justify-content: space-between; align-items: flex-start;
               gap: var(--sp-2); }
  .sk-pavadinimas { font-weight: var(--fw-bold); color: var(--text); font-size: 0.95rem;
                    line-height: 1.25; flex: 1; min-width: 0; text-decoration: none; }
  .sk-pavadinimas:hover { color: var(--accent); }
  .sk-kaina { font-size: 1.05rem; font-weight: 800; color: var(--text);
              white-space: nowrap; flex-shrink: 0; }
  .sk-kada { font-size: var(--fs-sm); color: var(--text-muted); margin: 2px 0 var(--sp-2); }
  .sk-spec { color: var(--text-muted); font-size: 0.82rem; line-height: 1.4; margin-top: 4px; }
  .sk-vieta { font-size: var(--fs-sm); color: var(--text-muted); margin-top: 2px; }

  .sk-veiksmai { display: flex; gap: var(--sp-2); margin-top: var(--sp-3); flex-wrap: wrap; }
  .sk-veiksmas { display: inline-flex; align-items: center; gap: 6px;
                 height: var(--btn-h-sm); padding: 0 var(--sp-3);
                 border: 1px solid var(--border); border-radius: var(--r-md);
                 background: var(--surface); color: var(--text);
                 font-size: var(--fs-sm); text-decoration: none; cursor: pointer; }
  .sk-veiksmas:hover { border-color: var(--accent); color: var(--accent); }
  .sk-veiksmas svg { width: 16px; height: 16px; }

  .sk-salinti { position: absolute; top: var(--sp-2); right: var(--sp-2);
                width: 30px; height: 30px; display: flex; align-items: center;
                justify-content: center; border: 1px solid var(--border);
                border-radius: 50%; background: var(--surface);
                color: var(--text-muted); cursor: pointer; }
  .sk-salinti:hover { color: var(--text); border-color: var(--accent); }
  .sk-salinti svg { width: 14px; height: 14px; }

  /* Kortelės viduje esančios bendros žymos (laikas, „Naujas") */
  .sk-kort .card-top-left { position: absolute; top: 8px; left: 8px; z-index: 3;
                            display: flex; gap: 4px; }
  .sk-kort .card-badge-group { display: inline-flex; align-items: stretch;
                               border-radius: 5px; overflow: hidden;
                               box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  .sk-kort .card-badge-new { display: inline-flex; align-items: center; padding: 3px 8px;
                             background: rgba(16,185,129,.55); color: #fff;
                             font-size: .62rem; font-weight: 700;
                             text-shadow: 0 1px 2px rgba(0,0,0,.4); }
  .sk-kort .card-badge-time { display: inline-flex; align-items: center; padding: 3px 8px;
                              background: rgba(0,0,0,.45); color: #fff;
                              font-size: .62rem; font-weight: 600;
                              text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .sk-kort .card-bottom-left { position: absolute; bottom: 8px; left: 8px; z-index: 3;
                               display: flex; gap: 4px; }
  .sk-kort .card-mini-badge { display: inline-flex; align-items: center; padding: 2px 6px;
                              border-radius: 4px; font-size: .6rem; font-weight: 700;
                              line-height: 1; }

  .sk-tuscia { text-align: center; padding: var(--sp-10) var(--sp-4);
               background: var(--surface); border: 1px solid var(--border);
               border-radius: var(--r-md); color: var(--text-muted); }
  .sk-tuscia svg { width: 40px; height: 40px; margin: 0 auto var(--sp-3); display: block; }
  .sk-tuscia p { font-size: var(--fs-base); margin-bottom: var(--sp-4); }
  .sk-mygtukas { display: inline-flex; align-items: center; height: var(--btn-h);
                 padding: 0 var(--sp-5); border-radius: var(--r-md);
                 background: var(--accent); color: var(--accent-contrast);
                 text-decoration: none; font-weight: var(--fw-semibold); }

  @media (max-width: 767px) {
    .sk-kort { flex-direction: column; gap: 0; }
    .sk-nuotrauka { flex: 0 0 auto; width: 100%; height: 200px; }
    .sk-turinys { padding: var(--sp-3) 44px var(--sp-3) var(--sp-3); }
  }
</style>
