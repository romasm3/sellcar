{% load i18n %}
{# Kaina Nuo/Iki — tie patys žingsniai kaip cars/moto tab'uose #}
<div>
  <label class="block text-[12.5px] font-bold mb-[5px]">{% trans "Kaina" %}</label>
  <div class="grid grid-cols-2 gap-3">
    <div class="sp-sel">
      <select name="price_min" class="sp-fld">
        <option value="">{% trans "Nuo" %}</option>
        <option value="5">5</option><option value="10">10</option>
        <option value="25">25</option><option value="50">50</option>
        <option value="100">100</option><option value="250">250</option>
        <option value="500">500</option><option value="1000">1 000</option>
        <option value="2000">2 000</option><option value="5000">5 000</option>
      </select>
    </div>
    <div class="sp-sel">
      <select name="price_max" class="sp-fld">
        <option value="">{% trans "Iki" %}</option>
        <option value="10">10</option><option value="25">25</option>
        <option value="50">50</option><option value="100">100</option>
        <option value="250">250</option><option value="500">500</option>
        <option value="1000">1 000</option><option value="2000">2 000</option>
        <option value="5000">5 000</option><option value="10000">10 000</option>
      </select>
    </div>
  </div>
</div>
