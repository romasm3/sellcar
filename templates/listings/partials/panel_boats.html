{% load i18n %}
{# ═══ PANELĖ: VALTYS ═══ #}

{# ── Tipas ── #}
<div>
    <span class="sp-label">{% trans "Type" %}</span>
    <select name="boat_type" class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm">
        <option value="">{% trans "All" %}</option>
        {% for val, label in boat_type_choices %}
        <option value="{{ val }}" {% if selected_boat_type == val %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
    </select>
</div>

{# ── Medžiaga ── #}
<div>
    <span class="sp-label">{% trans "Material" %}</span>
    <select name="boat_material" class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm">
        <option value="">{% trans "All" %}</option>
        <option value="aluminium" {% if request.GET.boat_material == 'aluminium' %}selected{% endif %}>{% trans "Aluminium" %}</option>
        <option value="steel" {% if request.GET.boat_material == 'steel' %}selected{% endif %}>{% trans "Steel" %}</option>
        <option value="fiberglass" {% if request.GET.boat_material == 'fiberglass' %}selected{% endif %}>{% trans "Fiberglass / Plastic" %}</option>
        <option value="wood" {% if request.GET.boat_material == 'wood' %}selected{% endif %}>{% trans "Wood" %}</option>
        <option value="pvc" {% if request.GET.boat_material == 'pvc' %}selected{% endif %}>{% trans "PVC / Rubber" %}</option>
        <option value="other" {% if request.GET.boat_material == 'other' %}selected{% endif %}>{% trans "Other" %}</option>
    </select>
</div>

{# ── Metai ── #}
<div>
    <span class="sp-label">{% trans "Year" %}</span>
    <div class="flex gap-2">
        <select name="year_min" class="flex-1 min-w-0 px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm">
            <option value="">{% trans "From" %}</option>
            {% for year in years %}<option value="{{ year }}" {% if request.GET.year_min == year|stringformat:"i" %}selected{% endif %}>{{ year }}</option>{% endfor %}
        </select>
        <select name="year_max" class="flex-1 min-w-0 px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm">
            <option value="">{% trans "To" %}</option>
            {% for year in years %}<option value="{{ year }}" {% if request.GET.year_max == year|stringformat:"i" %}selected{% endif %}>{{ year }}</option>{% endfor %}
        </select>
    </div>
</div>

{# ── Kaina ── #}
<div>
    <span class="sp-label">{% trans "Price Range" %}</span>
    <div class="flex gap-2">
        <input type="number" name="price_min" placeholder="{% trans 'Min €' %}" value="{{ request.GET.price_min }}" class="flex-1 min-w-0 px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm">
        <input type="number" name="price_max" placeholder="{% trans 'Max €' %}" value="{{ request.GET.price_max }}" class="flex-1 min-w-0 px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm">
    </div>
</div>

{# ── Tekstinė paieška ── #}
<div class="sm:col-span-2">
    <span class="sp-label">{% trans "Text search" %}</span>
    <input type="text" name="search" value="{{ search_query|default:'' }}" placeholder="{% trans 'Search...' %}"
           class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm">
</div>
