{% comment %}Žemėlapio paieškos stiliai — matmenys ir spalvos iš
docs/dizaino-sistema.md (jokios violetinės ar juodų mygtukų).{% endcomment %}
<style>
  .zp { max-width: 1440px; margin: 0 auto; padding: var(--sp-4) var(--sp-4) 0; }

  /* ═══ Filtrų juosta ═══ */
  .zp-juosta { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap;
               padding-bottom: var(--sp-3); }
  .zp-vieta { position: relative; flex: 1 1 260px; min-width: 200px; display: flex;
              align-items: center; gap: var(--sp-2); height: var(--btn-h);
              padding: 0 var(--sp-3); border: 1px solid var(--border);
              border-radius: var(--r-md); background: var(--surface); }
  .zp-vieta i { color: var(--text-muted); }
  .zp-vieta input { flex: 1; border: 0; outline: none; font-size: var(--fs-base);
                    color: var(--text); background: none; min-width: 0; }
  .zp-vietos { position: absolute; z-index: 60; left: 0; right: 0; top: calc(100% + 4px);
               background: var(--surface); border: 1px solid var(--border);
               border-radius: var(--r-md); box-shadow: 0 12px 32px rgba(17,24,39,.14);
               overflow: hidden; }
  .zp-vieta-siul { display: block; width: 100%; text-align: left; padding: 10px 14px;
                   font-size: var(--fs-sm); background: none; border: 0;
                   border-bottom: 1px solid #F1F1F1; cursor: pointer; }
  .zp-vieta-siul:hover { background: var(--accent-soft); }

  .zp-sel { height: var(--btn-h); padding: 0 var(--sp-3); border: 1px solid var(--border);
            border-radius: var(--r-md); background: var(--surface); color: var(--text);
            font-size: var(--fs-sm); }
  .zp-filtrai-btn, .zp-slepti { display: inline-flex; align-items: center; gap: 8px;
            height: var(--btn-h); padding: 0 var(--sp-4); border: 1px solid var(--border);
            border-radius: var(--r-md); background: var(--surface); color: var(--text);
            font-size: var(--fs-sm); font-weight: var(--fw-semibold); cursor: pointer; }
  .zp-filtrai-btn:hover, .zp-slepti:hover { border-color: var(--accent); color: var(--accent); }
  .zp-slepti { margin-left: auto; }
  .zp-filtru-sk { display: inline-flex; align-items: center; justify-content: center;
                  min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px;
                  background: var(--accent); color: var(--accent-contrast);
                  font-size: var(--fs-xs); }

  /* ═══ Aktyvių filtrų žymės ═══ */
  .zp-zymes { display: flex; flex-wrap: wrap; gap: var(--sp-2); padding-bottom: var(--sp-3); }
  .zp-zyme { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 12px;
             background: var(--accent-soft); border-radius: 999px; font-size: var(--fs-sm); }
  .zp-zyme button { border: 0; background: none; color: var(--accent); cursor: pointer;
                    font-size: 13px; line-height: 1; padding: 2px 4px; }
  .zp-valyti { border: 0; background: none; color: var(--accent); font-size: var(--fs-sm);
               font-weight: var(--fw-semibold); cursor: pointer; }

  /* ═══ Du stulpeliai ═══ */
  .zp-turinys { display: grid; grid-template-columns: 55% 45%; gap: var(--sp-4);
                align-items: start; }
  .zp-turinys.be-zemelapio { grid-template-columns: 1fr; }
  .zp-kaire { min-width: 0; }
  .zp-rasta { font-size: var(--fs-base); color: var(--text-muted); margin-bottom: var(--sp-3); }
  .zp-rasta strong { color: var(--text); font-size: 18px; }
  .zp-sarasas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: var(--sp-3); align-content: start; }
  .zp-turinys.be-zemelapio .zp-sarasas { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  /* Kortelė siaurame stulpelyje — nuotrauka viršuje, ne šone */
  .zp-sarasas .sk-kort { flex-direction: column; gap: 0; }
  .zp-sarasas .sk-nuotrauka { flex: 0 0 auto; width: 100%; height: 150px; }
  .zp-sarasas .sk-turinys { padding: var(--sp-3); }
  .zp-sarasas .sk-veiksmai { display: none; }          /* siauroje kortelėje netelpa */
  .zp-kort-rem.is-pazymeta .sk-kort { border-color: var(--accent);
                                      box-shadow: 0 0 0 2px var(--accent-soft); }

  /* ═══ Žemėlapis ═══ */
  .zp-desine { position: sticky; top: 84px; }
  .zp-zemelapio-rem { position: relative; }
  .zp-zemelapis { height: calc(100vh - 120px); min-height: 420px;
                  border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; }
  .zp-ieskoti-cia { position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
                    z-index: 5; display: inline-flex; align-items: center; gap: 8px;
                    height: var(--btn-h); padding: 0 var(--sp-4); border-radius: 999px;
                    border: 1px solid var(--accent); background: var(--accent);
                    color: var(--accent-contrast); font-weight: var(--fw-semibold);
                    font-size: var(--fs-sm); cursor: pointer;
                    box-shadow: 0 6px 18px rgba(17,24,39,.18); }
  /* OSM nuoroda skirta vietų paieškai (Photon), ne Google žemėlapiui —
     todėl rodoma juostoje prie lauko, o ne ant žemėlapio. */
  .zp-osm-mini { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
  .zp-osm-mini a { color: inherit; text-decoration: underline; }

  .zp-mob-jungiklis { display: none; }

  /* ═══ Filtrų langas ═══ */
  .zf-danga { position: fixed; inset: 0; z-index: 120; background: rgba(17,24,39,.55);
              display: flex; align-items: center; justify-content: center; padding: var(--sp-4); }
  .zf-langas { width: 680px; max-width: 100%; max-height: 90vh; display: flex;
               flex-direction: column; background: var(--surface); border-radius: 16px;
               overflow: hidden; }
  .zf-virsus { display: flex; align-items: center; justify-content: space-between;
               padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--border); }
  .zf-virsus h2 { font-size: 20px; font-weight: var(--fw-bold); color: var(--text); }
  .zf-uzdaryti { border: 0; background: none; font-size: 18px; color: var(--text-muted);
                 cursor: pointer; padding: 4px 8px; }
  .zf-turinys { overflow-y: auto; padding: var(--sp-5); display: flex;
                flex-direction: column; gap: var(--sp-6); }
  .zf-vardas { font-size: var(--fs-xs); font-weight: var(--fw-semibold);
               text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted);
               margin-bottom: var(--sp-3); }

  .zf-korteles { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: var(--sp-2); }
  .zf-kortele { display: flex; flex-direction: column; align-items: center; gap: 8px;
                padding: var(--sp-3); border: 1px solid var(--border); border-radius: var(--r-md);
                background: var(--surface); color: var(--text); cursor: pointer;
                font-size: var(--fs-sm); }
  .zf-kortele i { font-size: 20px; color: var(--text-muted); }
  .zf-kortele.is-on { border-color: var(--accent); background: var(--accent-soft); }
  .zf-kortele.is-on i { color: var(--accent); }

  .zf-zymos { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
  .zf-zyma { display: inline-flex; align-items: center; gap: 8px; height: var(--btn-h-sm);
             padding: 0 var(--sp-3); border: 1px solid var(--border); border-radius: 999px;
             background: var(--surface); color: var(--text); font-size: var(--fs-sm);
             cursor: pointer; }
  .zf-zyma i, .zf-zyma svg { color: var(--text-muted); }
  .zf-zyma.is-on { border-color: var(--accent); background: var(--accent-soft);
                   color: var(--accent); font-weight: var(--fw-semibold); }
  .zf-zyma.is-on i, .zf-zyma.is-on svg { color: var(--accent); }

  .zf-paieska { width: 100%; height: var(--btn-h); padding: 0 var(--sp-3);
                border: 1px solid var(--border); border-radius: var(--r-md);
                font-size: var(--fs-base); margin-bottom: var(--sp-2); }
  .zf-markes { max-height: 180px; overflow-y: auto; display: grid;
               grid-template-columns: repeat(2, minmax(0,1fr)); gap: 6px; }
  .zf-varnele { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm);
                color: var(--text); cursor: pointer; }

  .zf-diapazonai { display: grid; grid-template-columns: repeat(3, minmax(0,1fr));
                   gap: var(--sp-4); }
  .zf-diapazonas { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); }
  .zf-diapazonas .zf-vardas { grid-column: 1 / -1; margin-bottom: 0; }
  .zf-diapazonas input { height: var(--btn-h); padding: 0 var(--sp-3);
                         border: 1px solid var(--border); border-radius: var(--r-md);
                         font-size: var(--fs-base); min-width: 0; }

  .zf-apacia { position: sticky; bottom: 0; display: flex; align-items: center;
               justify-content: space-between; gap: var(--sp-3);
               padding: var(--sp-4) var(--sp-5); border-top: 1px solid var(--border);
               background: var(--surface); }
  .zf-valyti { border: 0; background: none; color: var(--accent); font-size: var(--fs-sm);
               font-weight: var(--fw-semibold); cursor: pointer; }
  .zf-rodyti { height: var(--btn-h); padding: 0 var(--sp-6); border: 0;
               border-radius: var(--r-md); background: var(--accent);
               color: var(--accent-contrast); font-weight: var(--fw-semibold);
               font-size: var(--fs-base); cursor: pointer; }

  /* ═══ Telefonas ═══ */
  @media (max-width: 1023px) {
    .zp { padding: var(--sp-3) var(--sp-3) 0; }
    .zp-slepti { display: none; }
    .zp-turinys { grid-template-columns: 1fr; }
    .zp-sarasas { grid-template-columns: 1fr; }
    .zp-sarasas .sk-veiksmai { display: flex; }
    .zp-desine { position: fixed; inset: 56px 0 0; z-index: 90; background: var(--surface);
                 padding: var(--sp-2); display: none; }
    .zp-desine.mob-matomas { display: block; }
    .zp-zemelapis { height: calc(100vh - 140px); }
    .zp-mob-jungiklis { display: inline-flex; align-items: center; gap: 8px;
                        position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
                        z-index: 95; height: var(--btn-h); padding: 0 var(--sp-5);
                        border-radius: 999px; border: 1px solid var(--accent);
                        background: var(--accent); color: var(--accent-contrast);
                        font-weight: var(--fw-semibold); cursor: pointer;
                        box-shadow: 0 6px 18px rgba(17,24,39,.2); }
    .zf-langas { width: 100%; max-width: 100%; height: 100%; max-height: 100%;
                 border-radius: 0; }
    .zf-danga { padding: 0; }
    .zf-korteles { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .zf-diapazonai { grid-template-columns: 1fr; }
  }
</style>
<style>
  /* ═══ Burbulas paspaudus žymeklį (268 px) ═══ */
  .zb { width: 268px; position: relative; }
  .zb-uzdaryti { position: absolute; top: 8px; right: 8px; z-index: 2;
                 width: 28px; height: 28px; border: 0; border-radius: 999px;
                 background: rgba(255,255,255,.92); color: var(--text);
                 box-shadow: 0 1px 3px rgba(17,24,39,.25); cursor: pointer;
                 display: flex; align-items: center; justify-content: center; }
  .zb-uzdaryti:hover { background: #fff; }
  .zb-foto { position: relative; display: block; aspect-ratio: 16 / 10;
             background: var(--accent-soft); overflow: hidden; border-radius: 8px; }
  .zb-foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .zb-be-foto { display: flex; align-items: center; justify-content: center;
                width: 100%; height: 100%; color: var(--text-muted); font-size: 24px; }
  .zb-vin { position: absolute; top: 8px; left: 8px; padding: 2px 6px;
            background: rgba(6,118,71,.9); color: #fff; font-size: 11px;
            font-weight: 600; border-radius: 4px; }
  .zb-turinys { padding: 10px 2px 2px; }
  .zb-pav { display: block; font-size: 14px; font-weight: 700; color: var(--text);
            text-decoration: none; line-height: 1.25; }
  .zb-pav:hover { color: var(--accent); }
  .zb-kaina { font-size: 16px; font-weight: 800; color: var(--text); margin-top: 2px; }
  .zb-spec { font-size: 12px; color: var(--text-muted); margin-top: 2px;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .zb-vieta { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .zb-neaisku { margin-top: 6px; padding: 6px 8px; background: var(--accent-soft);
                border-radius: 6px; font-size: 11.5px; color: var(--text); }
  .zb-mygtukai { display: flex; gap: 6px; margin-top: 10px; }
  .zb-btn { flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center;
            height: 36px; border: 1px solid var(--border); border-radius: var(--r-md);
            font-size: 13px; font-weight: 600; color: var(--text); text-decoration: none; }
  .zb-btn-pirmas { background: var(--accent); border-color: var(--accent);
                   color: var(--accent-contrast); }

  /* ═══ Prekiautojo aikštelė ═══ */
  .za { max-height: 320px; overflow-y: auto; width: 300px; }
  .za-eil { display: flex; align-items: center; gap: 10px; padding: 8px;
            border-bottom: 1px solid var(--border); text-decoration: none; }
  .za-eil:hover { background: var(--accent-soft); }
  .za-foto { flex: 0 0 auto; width: 56px; height: 42px; border-radius: 6px;
             overflow: hidden; background: var(--accent-soft); }
  .za-foto img { width: 100%; height: 100%; object-fit: cover; }
  .za-tekstas { flex: 1 1 auto; min-width: 0; }
  .za-pav { display: block; font-size: 13px; font-weight: 600; color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .za-spec { display: block; font-size: 11.5px; color: var(--text-muted);
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .za-kaina { flex: 0 0 auto; font-size: 13px; font-weight: 800; color: var(--text); }
  .za-tuscia { padding: var(--sp-4); color: var(--text-muted); font-size: var(--fs-sm); }

  /* ═══ Telefono apatinis lapas ═══ */
  .zl { display: none; }
  @media (max-width: 1023px) {
    .zl { display: block; position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
          max-height: 34vh; background: var(--surface); border-radius: 16px 16px 0 0;
          box-shadow: 0 -8px 28px rgba(17,24,39,.22); padding: 8px var(--sp-4) var(--sp-4);
          overflow-y: auto; transition: max-height .2s ease; }
    .zl.is-pilnas { max-height: 88vh; }
    .zl-rankena { display: block; width: 44px; height: 4px; margin: 0 auto 10px;
                  border: 0; border-radius: 999px; background: #D1D5DB; cursor: pointer; }
    .zl .zb { width: 100%; }
    .zl .zb-foto { aspect-ratio: 16 / 9; }
    .zl:not(.is-pilnas) .zb-foto { aspect-ratio: auto; height: 84px; }
    .zl:not(.is-pilnas) .zb-neaisku { display: none; }
    .zl .zb-mygtukai { position: sticky; bottom: 0; background: var(--surface);
                       padding-top: 8px; }
    .zl .zb-btn { height: 44px; }
  }
</style>
<style>
  /* Google burbulo rėmas — be papildomų paraščių, kad kortelė būtų 268 px */
  .gm-style-iw.gm-style-iw-c { padding: 8px !important; border-radius: 12px; }
  .gm-style-iw-d { overflow: hidden !important; }
  /* Google ✕ slepiam — kortelė turi savo, kad veiktų ir apatiniame lape */
  .gm-style-iw-chr { display: none; }
</style>
